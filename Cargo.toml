[package]
name = "duckdb-tantivy"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "DuckDB loadable extension: BM25 full-text search, tokenization, and Snowball stemming powered by tantivy (quack-rs binding layer, no VGI, no Arrow IPC)"

[lib]
name = "tantivy"
crate-type = ["cdylib"]

# Packaging tool (copied from quack-rs, std-only): stamps the 534-byte DuckDB
# extension metadata footer onto the built cdylib to produce the loadable
# .duckdb_extension. `cargo run --bin append_metadata`.
[[bin]]
name = "append_metadata"
path = "src-bin/append_metadata/main.rs"

# Wasm (emscripten side-module) build: extension-ci-tools' rust.Makefile builds
# wasm platforms as `cargo build --example tantivy` and expects a staticlib
# (libtantivy.a) — crate-type cannot be selected per target, so the example
# remaps the lib crate (src/wasm_lib.rs). Mirrors duckdb-html-readability.
[[example]]
name = "tantivy"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
# tantivy — the Rust full-text search engine (MIT). Pinned to the 0.24 line: its
# MSRV is under rust-version and it builds cleanly there; 0.25/0.26 bump
# the toolchain past it. We use its BM25 scoring, its tokenizer/Snowball-stemmer
# stack, its in-process RAM-directory index (ephemeral searches), and — since
# v0.3 — its MmapDirectory for persistent on-disk named indexes.
tantivy = { version = "=0.24.2", default-features = false }

serde_json = "1"
# turbovec — same crate duckdb_turbovec uses; lets us load its on-disk
# IdMapIndex (.tv files) directly for the vector half of RRF hybrid search
turbovec = "1.1"
# jieba-rs — Chinese word segmentation (MIT). Pinned to the 0.7 line per the
# feature design: 0.7.x's `cut()` API is stable, embeds the dictionary (no
# file IO), and is Send+Sync (wrappable in Arc for tantivy's shared
# TextAnalyzer). 0.10 changes the API surface and is left for a follow-up.
# Used only for the non-Snowball `chinese` language (see search::Lang::Chinese).
jieba-rs = "0.7"
# Unicode NFC normalization, applied to both indexed documents and queries
# before tokenization so canonically-equivalent spellings match (see
# search::nfc). Pure-Rust, no transitive C deps.
unicode-normalization = "0.1"
# quack-rs — pure-Rust wrapper over DuckDB's C Extension API (crates.io).
# 0.18.0 is the version this code was written and tested against; pinned
# exactly (like tantivy) so the reviewed ABI-wrapper version can never float
# under a caret requirement (the lockfile fixes it today, but a CI or local
# `cargo update` would re-resolve it otherwise).
quack-rs = { version = "=0.18.0", features = ["duckdb-1-5-4"] }
# C extension API headers/symbols; the cdylib resolves them against the host
# DuckDB process at LOAD time. Left as a caret so the committed Cargo.lock can
# pin the exact resolved version (1.10506) without a manifest/lock mismatch;
# CI and the Makefile build with `--locked` so this ABI layer can never float
# to an unvalidated 1.x patch release.
libduckdb-sys = { version = "1.10504", features = ["loadable-extension"] }

# wasm32: tantivy's default `mmap` feature pulls memmap2, which has no
# wasm32-unknown-unknown story; disabling it switches tantivy to RamDirectory.
# getrandom/uuid need their `js` backends on that target. Proven in
# /tmp/tantivy-wasm-probe (cargo check --target wasm32-unknown-unknown OK).
# Native builds keep the exact same tantivy code: RamDirectory is what the
# ephemeral search path already uses; MmapDirectory sites below are cfg'd.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tantivy = { version = "=0.24.2", default-features = false, features = ["mmap", "stopwords", "lz4-compression"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tantivy = { version = "=0.24.2", default-features = false, features = ["stopwords", "lz4-compression"] }
# Only to export `__getrandom_v03_custom` (getrandom 0.4 custom backend —
# uuid v4 → tantivy SegmentId); see src/getrandom_custom.rs. Must match the
# getrandom major that uuid pulls so the symbol signature resolves.
getrandom = { version = "0.4", default-features = false }

[dev-dependencies]
# SQL-level integration tests: InMemoryDb compiles a real bundled DuckDB so the
# built .duckdb_extension can be LOADed inside `cargo test`.
quack-rs = { version = "0.18.0", features = ["bundled-test"] }
duckdb = { version = "1.1.0", features = ["bundled"] }

[profile.release]
# `unwind`, not `abort`: every callback is wrapped in quack-rs's
# panic-safe `*_callback!` macros (catch_unwind → set_error), so a panic in
# extension code becomes a DuckDB error instead of aborting the host process.
# Under `panic = "abort"` that machinery is inert.
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
strip = true
