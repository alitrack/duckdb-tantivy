name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Build + test every platform natively. No upload-artifact anywhere, so this
# workflow never touches the shared Actions artifact-storage pool (the same
# pattern as the entia workflows). rust-cache uses the separate 10GB/repo
# Actions-cache allowance.
jobs:
  build:
    name: Build & test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            test: true
          - os: macos-15
            platform: osx_arm64
            test: true
          - os: macos-13
            platform: osx_amd64
            test: true
          # The cargo e2e suite compiles a bundled in-memory DuckDB from
          # source (full C++ toolchain); it is skipped on Windows, where the
          # build+stamp is still verified below.
          - os: windows-latest
            platform: windows_amd64
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y

      - name: Configure (venv, platform, version)
        shell: bash
        run: make configure

      - name: Build + stamp metadata
        shell: bash
        run: make release

      - name: Test (cargo unit + SQL-level e2e)
        if: matrix.test
        shell: bash
        run: make test

      - name: Verify artifact
        shell: bash
        run: |
          ls -la build/release/tantivy.duckdb_extension
          file build/release/tantivy.duckdb_extension
